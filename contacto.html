<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insausti Federico - Contacto</title>

    <!-- Favicon -->
    <link rel="icon" type="image/webp" href="img/f-logofabicon.webp">

    <!-- Hoja de estilos -->
    <link rel="stylesheet" href="estilos.css">
</head>

<body class="page-contact">

    <header>
        <div class="logo" aria-label="Federico Insausti">F</div>
        <nav>
            <a href="index.html" class="boton-head">SOBRE MÍ</a>
            <a href="porfolio.html" class="boton-head">PORFOLIO</a>
            <a href="contacto.html" class="boton-head">CONTACTO</a>
        </nav>
        <div class="language-switcher">
            <label class="visually-hidden" for="site-language">Idioma del sitio</label>
            <select class="language-select" id="site-language" aria-label="Idioma del sitio">
                <option value="es">ESPAÑOL</option>
                <option value="en">ENGLISH</option>
                <option value="fr">FRANÇAIS</option>
            </select>
        </div>
    </header>

    <main>
        <section>
            <h1>TRABAJEMOS JUNTOS</h1>

            <form action="https://formsubmit.io/f/feb82d72-160c-404a-a0c5-b6f20b343478" method="POST"
                enctype="multipart/form-data">
                <div class="form-row">
                    <div class="field-group">
                        <label for="company-name">Nombre de la empresa</label>
                        <input type="text" id="company-name" name="Company name" required>
                    </div>

                    <div class="field-group">
                        <label for="primary-contact">Persona de contacto</label>
                        <input type="text" id="primary-contact" name="Primary contact" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="field-group">
                        <label for="email">Correo electrónico</label>
                        <input type="email" id="email" name="Email" required>
                    </div>

                    <div class="field-group">
                        <label for="phone">Teléfono</label>
                        <input type="tel" id="phone" name="Phone">
                    </div>
                </div>

                <div class="field-group full-width">
                    <label for="target-start-date">Fecha de inicio estimada</label>
                    <input type="date" id="target-start-date" name="Target start date">
                </div>

                <div class="field-group full-width">
                    <label for="goals">Objetivos del proyecto</label>
                    <textarea id="goals" name="Goals for the engagement" rows="4" required></textarea>
                </div>

                <div class="field-group full-width">
                    <label for="brand-assets">Archivos de marca o brief</label>
                    <input type="file" id="brand-assets" name="Brand assets or brief" accept="image/*" multiple>
                    <div class="image-preview-list" id="image-preview-list" aria-live="polite"></div>
                </div>

                <input type="text" name="_formsubmit_id" tabindex="-1" autocomplete="off" hidden>

                <button class="btn-submit" type="submit">Enviar formulario</button>
            </form>
        </section>

        <section>
            <h2>contacto</h2>
            <div class="direct-contact">
                <svg class="icon-mail" viewBox="0 0 24 24">
                    <path
                        d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z" />
                </svg>
                <a href="mailto:fededreve@gmail.com">fededreve@gmail.com</a>
            </div>
        </section>
    </main>

    <footer>
        <p class="copyright">SITE CONTENT INSAUSTI FEDERICO ALL RIGHTS RESERVED</p>
        <div class="social-links">
            <a href="https://www.instagram.com/3dreve/" target="_blank" rel="noopener">Instagram</a>
            <a href="https://www.linkedin.com/in/federico-ezequiel-insausti-casale/" target="_blank"
                rel="noopener">LinkedIn</a>
        </div>
    </footer>
    <script src="traductor.js"></script>
    <script src="image-previews.js"></script>
    <script src="scroll-animations.js"></script>
</body>

</html>
